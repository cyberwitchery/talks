# the running lab in netbox's vocabulary.
transforms:
  file: ./transforms.star
schema:
  types:
    dcim.site:
      key: { slug: { type: slug } }
      fields:
        name: { type: string }
        slug: { type: slug }
        status: { type: string }
    dcim.manufacturer:
      key: { slug: { type: slug } }
      fields:
        name: { type: string }
        slug: { type: slug }
    dcim.device_type:
      key: { slug: { type: slug } }
      fields:
        manufacturer: { type: ref, target: dcim.manufacturer }
        model: { type: string }
        slug: { type: slug }
    dcim.device_role:
      key: { slug: { type: slug } }
      fields:
        name: { type: string }
        slug: { type: slug }
    dcim.platform:
      key: { slug: { type: slug } }
      fields:
        name: { type: string }
        slug: { type: slug }
    dcim.device:
      key: { name: { type: slug } }
      fields:
        name: { type: slug }
        site: { type: ref, target: dcim.site }
        role: { type: ref, target: dcim.device_role }
        device_type: { type: ref, target: dcim.device_type }
        platform: { type: ref, target: dcim.platform }
        status: { type: string }
    dcim.interface:
      key:
        device: { type: ref, target: dcim.device }
        name: { type: string }
      fields:
        name: { type: string }
        device: { type: ref, target: dcim.device }
        type: { type: string }
    dcim.cable:
      key: { label: { type: string } }
      fields:
        label: { type: string }
        a_terminations: { type: list_ref, target: dcim.interface }
        b_terminations: { type: list_ref, target: dcim.interface }
# the catalog every node points at. a node's device type and manufacturer come
# from its image, its role from its name, its platform from its containerlab
# kind (transforms.star). a reference here is a uid, so a device type names its
# manufacturer by the uid the v5 pair below derives.
objects:
  - type: dcim.site
    key: { slug: fra1 }
    attrs: { name: fra1, slug: fra1, status: active }
    uid: { v5: { type: dcim.site, stable: fra1 } }
  - type: dcim.manufacturer
    key: { slug: nokia }
    attrs: { name: Nokia, slug: nokia }
    uid: { v5: { type: dcim.manufacturer, stable: nokia } }
  - type: dcim.manufacturer
    key: { slug: alpine }
    attrs: { name: Alpine, slug: alpine }
    uid: { v5: { type: dcim.manufacturer, stable: alpine } }
  - type: dcim.device_type
    key: { slug: srlinux }
    attrs: { model: SR Linux, slug: srlinux, manufacturer: f9c29e16-5035-5d23-8581-5da6b71848f6 }  # nokia
    uid: { v5: { type: dcim.device_type, stable: srlinux } }
  - type: dcim.device_type
    key: { slug: alpine }
    attrs: { model: Alpine Linux, slug: alpine, manufacturer: 4d912007-a628-5f16-b7b8-4c9c0088af35 }  # alpine
    uid: { v5: { type: dcim.device_type, stable: alpine } }
  - type: dcim.device_role
    key: { slug: spine }
    attrs: { name: Spine, slug: spine }
    uid: { v5: { type: dcim.device_role, stable: spine } }
  - type: dcim.device_role
    key: { slug: leaf }
    attrs: { name: Leaf, slug: leaf }
    uid: { v5: { type: dcim.device_role, stable: leaf } }
  - type: dcim.platform
    key: { slug: linux }
    attrs: { name: Linux, slug: linux }
    uid: { v5: { type: dcim.platform, stable: linux } }
  - type: dcim.platform
    key: { slug: nokia_srlinux }
    attrs: { name: SR Linux, slug: nokia_srlinux }
    uid: { v5: { type: dcim.platform, stable: nokia_srlinux } }
rules:
  - name: devices
    match: "dcim.device"
    uids:
      site: { v5: { type: dcim.site, stable: fra1 } }
      role: { v5: { type: dcim.device_role, stable: "${attrs.name|role}" } }
      device_type: { v5: { type: dcim.device_type, stable: "${attrs.image|type_slug}" } }
      platform: { v5: { type: dcim.platform, stable: "${attrs.kind}" } }
    emit:
      type: dcim.device
      key: { name: "${key.name}" }
      attrs:
        name: "${attrs.name}"
        site: "${uids.site}"
        role: "${uids.role}"
        device_type: "${uids.device_type}"
        platform: "${uids.platform}"
        status: active
  - name: interfaces
    match: "dcim.interface"
    emit:
      type: dcim.interface
      key: { device: "${attrs.device}", name: "${attrs.name}" }
      attrs: { name: "${attrs.name}", device: "${attrs.device}", type: other }
  - name: cables
    match: "dcim.cable"
    emit:
      type: dcim.cable
      key: { label: "${key.label}" }
      attrs:
        label: "${attrs.label}"
        a_terminations: "${attrs.a_terminations}"
        b_terminations: "${attrs.b_terminations}"
