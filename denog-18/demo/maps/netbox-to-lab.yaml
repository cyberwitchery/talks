# netbox's devices as containerlab nodes: the device type picks the image and
# the node kind.
transforms:
  file: ./transforms.star
schema:
  types:
    dcim.device:
      key: { name: { type: slug } }
      fields:
        name: { type: slug }
        kind: { type: string }
        image: { type: string }
        cmd: { type: string, nullable: true }
    dcim.interface:
      key:
        device: { type: ref, target: dcim.device }
        name: { type: string }
      fields:
        name: { type: string }
        device: { type: ref, target: dcim.device }
    dcim.cable:
      key: { label: { type: string } }
      fields:
        label: { type: string }
        a_terminations: { type: list_ref, target: dcim.interface }
        b_terminations: { type: list_ref, target: dcim.interface }
rules:
  - name: nodes
    match: "dcim.device"
    lookups:
      type: { ref: "${attrs.device_type}", get: "key.slug" }
    emit:
      type: dcim.device
      key: { name: "${key.name}" }
      attrs:
        name: "${attrs.name}"
        kind: "${lookup.type|kind}"
        image: "${lookup.type|image}"
        cmd: "${lookup.type|cmd}"
  - name: interfaces
    match: "dcim.interface"
    emit:
      type: dcim.interface
      key: { device: "${attrs.device}", name: "${attrs.name}" }
      attrs: { name: "${attrs.name}", device: "${attrs.device}" }
  - name: cables
    match: "dcim.cable"
    emit:
      type: dcim.cable
      key: { label: "${key.label}" }
      attrs:
        label: "${attrs.label}"
        a_terminations: "${attrs.a_terminations}"
        b_terminations: "${attrs.b_terminations}"
