# blackbox, prometheus and grafana on the lab host. alembic writes targets/.
name: denog-monitoring
services:
  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    networks: [clab]
  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./targets:/etc/prometheus/targets:ro
    ports: ["9090:9090"]
    networks: [clab]
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/denog.json
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/denog.yml:ro
    ports: ["3000:3000"]
    networks: [clab]
networks:
  # containerlab's management network: node names resolve on it.
  clab:
    external: true
