# what a running lab reads as: nodes, their interfaces, the cables between them.
schema:
  types:
    dcim.device:
      key: { name: { type: slug } }
      fields:
        name: { type: slug }
        kind: { type: string }
        image: { type: string }
        cmd: { type: string }
    dcim.interface:
      key:
        device: { type: ref, target: dcim.device }
        name: { type: string }
      fields:
        name: { type: string }
        device: { type: ref, target: dcim.device }
    dcim.cable:
      key: { label: { type: string } }
      fields:
        label: { type: string }
        a_terminations: { type: list_ref, target: dcim.interface }
        b_terminations: { type: list_ref, target: dcim.interface }
