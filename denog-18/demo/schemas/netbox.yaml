# what a netbox-sourced flow reads from netbox.
schema:
  types:
    dcim.site:
      key: { slug: { type: slug } }
      fields:
        name: { type: string }
        slug: { type: slug }
    dcim.manufacturer:
      key: { slug: { type: slug } }
      fields:
        name: { type: string }
        slug: { type: slug }
    dcim.devicetype:
      key: { slug: { type: slug } }
      fields:
        manufacturer: { type: ref, target: dcim.manufacturer }
        model: { type: string }
        slug: { type: slug }
    dcim.devicerole:
      key: { slug: { type: slug } }
      fields:
        name: { type: string }
        slug: { type: slug }
    dcim.platform:
      key: { slug: { type: slug } }
      fields:
        name: { type: string }
        slug: { type: slug }
    dcim.device:
      key: { name: { type: slug } }
      fields:
        name: { type: slug }
        site: { type: ref, target: dcim.site }
        role: { type: ref, target: dcim.devicerole }
        device_type: { type: ref, target: dcim.devicetype }
        platform: { type: ref, target: dcim.platform, nullable: true }
        status: { type: string }
    dcim.interface:
      key:
        device: { type: ref, target: dcim.device }
        name: { type: string }
      fields:
        name: { type: string }
        device: { type: ref, target: dcim.device }
    dcim.cable:
      key: { label: { type: string } }
      fields:
        label: { type: string }
        a_terminations: { type: list_ref, target: dcim.interface }
        b_terminations: { type: list_ref, target: dcim.interface }
